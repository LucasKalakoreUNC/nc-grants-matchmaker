name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          python -c "import pathlib,re; p=pathlib.Path('public/index.html').read_text(); pathlib.Path('/tmp/matchmaker-ui.js').write_text(re.search(r'<script>(.*?)</script>',p,re.S).group(1))"
          node --check /tmp/matchmaker-ui.js
